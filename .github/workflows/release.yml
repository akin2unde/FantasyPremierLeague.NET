name: Publish NuGet Packages

on:
  release:
    types:
      - published

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true

jobs:
  verify-main:
    name: Verify Release Is From Main
    runs-on: ubuntu-latest

    outputs:
      version: ${{ steps.version.outputs.version }}

    steps:
      - name: Checkout release commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch main branch
        run: git fetch origin main

      - name: Verify tag commit belongs to main
        shell: bash
        run: |
          echo "Release commit: $GITHUB_SHA"

          if ! git merge-base --is-ancestor "$GITHUB_SHA" "origin/main"; then
            echo "::error::The release tag is not based on a commit contained in main."
            echo "::error::Merge the release into main before publishing."
            exit 1
          fi

          echo "The release commit is contained in main."

      - name: Read version from release tag
        id: version
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"

          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Invalid release version: $VERSION"
            exit 1
          fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Publishing version $VERSION"

  publish:
    name: Build, Test and Publish
    needs: verify-main
    runs-on: ubuntu-latest
    environment: nuget-production

    steps:
      - name: Checkout release commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore FantasyPremierLeague.NET.sln

      - name: Build
        run: >
          dotnet build
          FantasyPremierLeague.NET.sln
          --configuration Release
          --no-restore
          -p:Version=${{ needs.verify-main.outputs.version }}

      - name: Test
        run: >
          dotnet test
          FantasyPremierLeague.NET.sln
          --configuration Release
          --no-build
          -p:Version=${{ needs.verify-main.outputs.version }}

      - name: Pack core SDK
        run: >
          dotnet pack
          src/FantasyPremierLeague/FantasyPremierLeague.csproj
          --configuration Release
          --no-build
          --output ./artifacts
          -p:PackageVersion=${{ needs.verify-main.outputs.version }}

      - name: Pack Playwright provider
        run: >
          dotnet pack
          src/FantasyPremierLeague.Playwright/FantasyPremierLeague.Playwright.csproj
          --configuration Release
          --no-build
          --output ./artifacts
          -p:PackageVersion=${{ needs.verify-main.outputs.version }}

      - name: Publish NuGet packages
        run: >
          dotnet nuget push
          "./artifacts/*.nupkg"
          --api-key "${{ secrets.NUGET_API_KEY }}"
          --source "https://api.nuget.org/v3/index.json"
          --skip-duplicate

      - name: Upload package artifacts
        uses: actions/upload-artifact@v4
        with:
          name: nuget-${{ needs.verify-main.outputs.version }}
          path: |
            artifacts/*.nupkg
            artifacts/*.snupkg