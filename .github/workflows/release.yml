name: Publish NuGet Packages

on:
  release:
    types:
      - published

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true

jobs:
  publish:
    name: Build and Publish
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Get version from release tag
        id: version
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Publishing version $VERSION"

      - name: Restore dependencies
        run: dotnet restore FantasyPremierLeague.NET.sln

      - name: Build solution
        run: >
          dotnet build
          FantasyPremierLeague.NET.sln
          --configuration Release
          --no-restore
          -p:Version=${{ steps.version.outputs.version }}

      - name: Run tests
        run: >
          dotnet test
          FantasyPremierLeague.NET.sln
          --configuration Release
          --no-build
          -p:Version=${{ steps.version.outputs.version }}

      - name: Pack core package
        run: >
          dotnet pack
          src/FantasyPremierLeague/FantasyPremierLeague.csproj
          --configuration Release
          --no-build
          --output ./artifacts
          -p:PackageVersion=${{ steps.version.outputs.version }}

      - name: Pack Playwright package
        run: >
          dotnet pack
          src/FantasyPremierLeague.Playwright/FantasyPremierLeague.Playwright.csproj
          --configuration Release
          --no-build
          --output ./artifacts
          -p:PackageVersion=${{ steps.version.outputs.version }}

      - name: Publish packages to NuGet
        run: >
          dotnet nuget push
          "./artifacts/*.nupkg"
          --api-key "${{ secrets.NUGET_API_KEY }}"
          --source "https://api.nuget.org/v3/index.json"
          --skip-duplicate

      - name: Upload release packages
        uses: actions/upload-artifact@v4
        with:
          name: nuget-release-${{ steps.version.outputs.version }}
          path: |
            artifacts/*.nupkg
            artifacts/*.snupkg